# Apache Virtual Host Configuration for RT Management System
# Save as: /etc/apache2/sites-available/rt-system.conf

<VirtualHost *:80>
    ServerName rt-system.your-domain.com
    ServerAlias www.rt-system.your-domain.com

    # Redirect HTTP to HTTPS
    Redirect permanent / https://rt-system.your-domain.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName rt-system.your-domain.com
    ServerAlias www.rt-system.your-domain.com
    DocumentRoot /var/www/rt-system/public

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/rt-system.your-domain.com/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rt-system.your-domain.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/rt-system.your-domain.com/chain.pem

    # SSL Security
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';"

    <Directory /var/www/rt-system/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Laravel URL Rewriting
        <IfModule mod_rewrite.c>
            RewriteEngine On

            # Handle Angular and other client-side routes
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>

        # PWA Service Worker
        <Files "sw.js">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
            Header set Service-Worker-Allowed "/"
        </Files>

        # Manifest file
        <Files "manifest.json">
            Header set Cache-Control "public, max-age=86400"
            Header set Content-Type "application/manifest+json"
        </Files>

        # Static assets caching
        <FilesMatch "\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
            ExpiresActive On
            ExpiresDefault "access plus 1 year"
            Header set Cache-Control "public, immutable"
        </FilesMatch>
    </Directory>

    # Deny access to sensitive files
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(env|git|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|Gruntfile\.js|gulpfile\.js|webpack\.config\.js|\.(babel|eslint|stylelint)rc|phpunit\.xml|\.phpunit\.result\.cache)$">
        Require all denied
    </FilesMatch>

    # Deny access to storage and bootstrap cache
    <DirectoryMatch "^/var/www/rt-system/(storage|bootstrap/cache)">
        Require all denied
    </DirectoryMatch>

    # PHP Configuration
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    # Logging
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/rt-system-error.log
    CustomLog ${APACHE_LOG_DIR}/rt-system-access.log combined

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
        AddOutputFilterByType DEFLATE application/json
        AddOutputFilterByType DEFLATE application/manifest+json
    </IfModule>
</VirtualHost>
